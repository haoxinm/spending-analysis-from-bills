repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        additional_dependencies:
          - pydantic>=2.7
          - types-PyYAML
        args: [--strict]
        files: ^src/

  - repo: local
    hooks:
      - id: no-statement-files
        name: Reject bank/card statement-shaped files outside fixtures
        entry: python scripts/check_no_statements.py
        language: python
        pass_filenames: true
        types: [file]
