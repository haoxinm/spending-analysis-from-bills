[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spend-analyzer"
version = "0.1.0"
description = "Locally-run spend analysis for credit/debit card bills and bank statements"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
authors = [{ name = "haoxinm" }]

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pdfplumber>=0.11",
  "litellm>=1.44",
  "keyring>=25.2",
  "pyyaml>=6.0",
  "typer>=0.12",
  "python-multipart>=0.0.9",
  "tomli-w>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "reportlab>=4.2",
  "httpx>=0.27",
  "pre-commit>=3.7",
  "types-PyYAML>=6.0",
]

[project.scripts]
spend-analyzer = "spend_analyzer.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/spend_analyzer"]
artifacts = ["*.yaml", "*.yml", "*.json"]

[tool.hatch.build.targets.wheel.force-include]
"src/spend_analyzer/classify/taxonomy.yaml" = "spend_analyzer/classify/taxonomy.yaml"

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pdfplumber.*", "reportlab.*", "litellm.*", "keyring.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["src/spend_analyzer"]
