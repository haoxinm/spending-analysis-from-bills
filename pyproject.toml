[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spend-analyzer"
version = "0.1.0"
description = "Locally-run spend analysis for credit/debit card bills and bank statements"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
authors = [{ name = "haoxinm" }]

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pdfplumber>=0.11",
  "litellm>=1.44",
  "keyring>=25.2",
  "pyyaml>=6.0",
  "typer>=0.12",
  "python-multipart>=0.0.9",
  "tomli-w>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "reportlab>=4.2",
  "httpx>=0.27",
  "pre-commit>=3.7",
  "types-PyYAML>=6.0",
]

[project.scripts]
spend-analyzer = "spend_analyzer.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/spend_analyzer"]
# `*.yaml`/`*.yml`/`*.json` are taxonomy/rules/aliases/issuer-category-map/JSON-Schema data files
# (§3.3, §3.6, §3.7); migrations are plain `.py` and already included via `packages`. `web/**` is
# the built frontend (P1-F's `vite.config.ts` outDir): git-ignored, so it needs an explicit
# artifacts entry to be force-included despite that — see `hatch_build.py`, which builds it.
artifacts = ["*.yaml", "*.yml", "*.json", "src/spend_analyzer/web/**/*"]

[tool.hatch.build.targets.wheel.force-include]
"src/spend_analyzer/classify/taxonomy.yaml" = "spend_analyzer/classify/taxonomy.yaml"

# Scoped to the wheel target only: an sdist ships the frontend *source* (built by the consumer's
# own wheel build, or by this same hook when `pip install` builds a wheel from that sdist), so
# building it again while producing the sdist itself would be wasted work.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
# Hatchling's default sdist file selection only reads the project-root `.gitignore`, not nested
# ones (`frontend/.gitignore`), so `frontend/node_modules/` (and any local `frontend/dist/`) must
# be excluded explicitly or `uv build --sdist`/`python -m build --sdist` ships hundreds of MB of
# installed npm packages. `src/spend_analyzer/web/` is already covered by the root `.gitignore`
# (a build hook regenerates it from `frontend/` at wheel-build time, so the sdist ships the
# frontend *source*, not its output) and `.venv`/`__pycache__`/`.mypy_cache` likewise.
exclude = [
  "frontend/node_modules/**",
  "frontend/dist/**",
  "**/__pycache__/**",
  "**/*.pyc",
  ".venv/**",
  ".mypy_cache/**",
  ".ruff_cache/**",
]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pdfplumber.*", "reportlab.*", "litellm.*", "keyring.*"]
ignore_missing_imports = true

# `hatchling` is a build-time-only dependency (declared in `[build-system] requires`, §4's stack
# table has no runtime use for it): it is installed into the isolated build backend environment a
# wheel/sdist build uses, not into this project's own `dev` extra, so no stub is available here.
[[tool.mypy.overrides]]
module = ["hatchling.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m \"not benchmark\""
markers = [
  "benchmark: performance-budget tests (§6.6); opt-in only, run with `-m benchmark`.",
]

[tool.coverage.run]
source = ["src/spend_analyzer"]
