# Federal income tax rate brackets and long-term capital gain (LTCG) rate breakpoints.
#
# Sources (IRS inflation adjustments, section 3 "Tax rate tables" and the capital gains
# breakpoints of section 1(j)(5)):
#   tax year 2022: Rev. Proc. 2021-45
#   tax year 2023: Rev. Proc. 2022-38
#   tax year 2024: Rev. Proc. 2023-34
#   tax year 2025: Rev. Proc. 2024-40 (the rate brackets and LTCG breakpoints were not changed
#                  by the One Big Beautiful Bill Act of July 2025)
# VALUES WERE COPIED BY HAND from those revenue procedures and cross-checked against published
# summaries: verify against the IRS publication before relying on them, and when adding a year.
# The married-filing-separately 15% breakpoint is listed as 258,600 / 276,900 / 291,850 / 300,000
# (the figures printed in the IRS worksheets); some commercial summaries round the 2023 and
# 2024 values to the nearest $25 (276,925 / 291,875), a difference of at most $25 of taxable income.
#
# Layout: year -> filing status -> {brackets, ltcg_0_to, ltcg_15_to}.
#   brackets   [[threshold_minor, rate_bp], ...]  threshold = lower bound of the bracket (cents,
#              taxable income "over" the previous bracket's top), rate in basis points
#              (1000 = 10%). Strictly increasing thresholds and rates, first threshold 0.
#   ltcg_0_to  top of the 0% long-term gain / qualified dividend band (cents of taxable income)
#   ltcg_15_to top of the 15% band; the 20% rate applies above it
# Filing statuses: single, mfj, mfs, hoh; qss (qualifying surviving spouse) uses the mfj
# tables (YAML alias). Rates above the table apply 37% at the last threshold.

# Rev. Proc. 2021-45 (sections 3.01 and 3.03)
2022:
  single:
    brackets: [[0, 1000], [1027500, 1200], [4177500, 2200], [8907500, 2400], [17005000, 3200], [21595000, 3500], [53990000, 3700]]
    ltcg_0_to: 4167500
    ltcg_15_to: 45975000
  mfj: &mfj_2022
    brackets: [[0, 1000], [2055000, 1200], [8355000, 2200], [17815000, 2400], [34010000, 3200], [43190000, 3500], [64785000, 3700]]
    ltcg_0_to: 8335000
    ltcg_15_to: 51720000
  mfs:
    brackets: [[0, 1000], [1027500, 1200], [4177500, 2200], [8907500, 2400], [17005000, 3200], [21595000, 3500], [32392500, 3700]]
    ltcg_0_to: 4167500
    ltcg_15_to: 25860000
  hoh:
    brackets: [[0, 1000], [1465000, 1200], [5590000, 2200], [8905000, 2400], [17005000, 3200], [21595000, 3500], [53990000, 3700]]
    ltcg_0_to: 5580000
    ltcg_15_to: 48850000
  qss: *mfj_2022

