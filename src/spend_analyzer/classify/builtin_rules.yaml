# Built-in merchant-classification rules (D8, cascade step 4, §2b P2-B, expanded by P4-B).
#
# ~120 high-precision patterns, grouped by taxonomy category/subcategory below. Precision over
# recall (D8): a rule earns its place only if a human would label it identically without context.
# Deliberately excluded, even though they are common: marketplaces and multi-purpose merchants
# whose category depends on *what* was bought rather than *who* sold it (Amazon marketplace,
# eBay, Etsy, generic "SQ *" card-network prefixes — the latter is stripped as boilerplate before
# matching anyway, see `ingest/normalize.py`), and any bank/card-issuer name (D14 — issuer names
# are user data, never hard-coded).
#
# Each entry needs a one-line `justification` and a `test_description` a test asserts it matches
# (specifically: the `merchant_key` that `ingest.normalize.normalize` derives from
# `test_description`, exactly what the cascade matches against at runtime — see `classify/rules.py`
# for why rules match `merchant_key` rather than `description_clean`/`description_raw`).
#
# match_type: "contains" (substring) or "regex" (a `re.IGNORECASE` pattern, matched with
# `re.search`). No "exact" entries here — that match type is far too narrow for a merchant name
# embedded in a longer description and is left for user-authored rules.
#
# `merchant_key` has already had punctuation replaced with spaces and store numbers stripped
# (§3.6, A27), so patterns below deliberately omit apostrophes/hyphens (e.g. "WENDYS", not
# "WENDY'S") to match the reduced key, and `test_description`s are written the way real card
# network descriptors actually look (upper-case, punctuation-light).

# --------------------------------------------------------------------------------------------
# travel / flights
# --------------------------------------------------------------------------------------------
- pattern: "DELTA AIR"
  match_type: contains
  category: travel
  subcategory: flights
  justification: "Airline ticket/fee descriptors starting \"DELTA AIR\" are unambiguously flights."
  test_description: "DELTA AIR 0062345678900 ATLANTA GA"

- pattern: "AMERICAN AIRLINES"
  match_type: contains
  category: travel
  subcategory: flights
  justification: "The full airline name (not bare \"AMERICAN\") is unambiguously a flight purchase."
  test_description: "AMERICAN AIRLINES 0012345678901 FORT WORTH TX"

- pattern: "UNITED AIRLINES"
  match_type: contains
  category: travel
  subcategory: flights
  justification: "The full airline name (not bare \"UNITED\") is unambiguously a flight purchase."
  test_description: "UNITED AIRLINES 0167890123456 CHICAGO IL"

- pattern: "SOUTHWEST AIRLINES"
  match_type: contains
  category: travel
  subcategory: flights
  justification: "Southwest Airlines is a single-purpose passenger carrier."
  test_description: "SOUTHWEST AIRLINES 5261234567890 DALLAS TX"

- pattern: "JETBLUE"
  match_type: contains
  category: travel
  subcategory: flights
  justification: "JetBlue is a single-purpose passenger carrier with no other line of business."
  test_description: "JETBLUE 2791234567890 NEW YORK NY"

