target-version = "py312"
line-length = 100
src = ["src", "tests"]

[lint]
select = [
  "E", "F", "W",   # pycodestyle / pyflakes
  "I",             # isort
  "UP",            # pyupgrade
  "B",             # bugbear
  "C4",            # comprehensions
  "SIM",           # simplify
  "RUF",           # ruff-specific
]
ignore = [
  "E501", # handled by formatter
]

[lint.isort]
known-first-party = ["spend_analyzer"]

[format]
quote-style = "double"
indent-style = "space"
